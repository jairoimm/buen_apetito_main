services:
  - type: web
    name: buen_apetito_main
    env: python
    rootDir: backend
    buildCommand: "pip install --upgrade pip && pip install --only-binary=:all: psycopg2-binary==2.9.9 && pip install -r requirements.txt && python manage.py collectstatic --noinput"
    startCommand: "gunicorn wsgi:application"
    envVars:
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
